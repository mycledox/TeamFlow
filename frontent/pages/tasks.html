<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My tasks — TeamFlow</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/pages/tasks.css"></head>
<body><div class="app-layout"><team-sidebar></team-sidebar><div class="app-main"><team-navbar></team-navbar><main class="page-content"><header class="page-heading"><div><h1>My tasks</h1><p>Plan your day and keep the important work moving.</p></div><button class="button button-primary" type="button" data-action="create-task">Add task <span class="button-plus" aria-hidden="true"></span></button></header><section class="panel"><div class="toolbar"><div class="segmented task-filters" role="group" aria-label="Filter tasks"><button type="button" data-task-filter="all" aria-pressed="true">All <span data-task-filter-count="all">0</span></button><button type="button" data-task-filter="todo" aria-pressed="false">To do <span data-task-filter-count="todo">0</span></button><button type="button" data-task-filter="in-progress" aria-pressed="false">In progress <span data-task-filter-count="in-progress">0</span></button><button type="button" data-task-filter="done" aria-pressed="false">Done <span data-task-filter-count="done">0</span></button></div><select class="select task-project-filter" aria-label="Filter by project" data-task-project-filter><option value="all">All projects</option></select></div><div class="table-wrap"><table class="data-table task-table"><thead><tr><th>Task</th><th>Project</th><th>Priority</th><th>Due date</th><th>Status</th><th>Complete</th></tr></thead><tbody data-task-list></tbody></table></div><div class="empty-state" data-task-empty hidden><div><span class="empty-symbol" aria-hidden="true"></span><h2>Nothing on your list</h2><p>Add a task and turn your next step into progress.</p><button class="button button-primary" type="button" data-action="create-task">Create a task</button></div></div></section></main></div></div><div id="modal-root"></div><script src="../js/app.js" defer></script><script src="../js/components/sidebar.js" defer></script><script src="../js/components/navbar.js" defer></script><script src="../js/task.js" defer></script></body></html>
