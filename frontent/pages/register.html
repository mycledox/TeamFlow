<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create an account — TeamFlow</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/pages/auth.css"></head>
<body class="auth-page"><main class="auth-shell"><aside class="auth-aside"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"></span><span>TeamFlow</span></a><div class="auth-promo"><div class="rocket-art"><span class="rocket-body"></span><span class="rocket-flame"></span><span class="rocket-star star-a"></span><span class="rocket-star star-b"></span><span class="rocket-star star-c"></span></div><h1>Create your account<br>and start making progress.</h1><ul><li>Build your team</li><li>Create projects</li><li>Track progress</li></ul></div><span class="auth-aside-foot">Your team's next big thing starts here.</span></aside><section class="auth-main"><div class="auth-form-wrap"><div class="mobile-brand"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"></span><span>TeamFlow</span></a></div><div class="auth-heading"><span class="eyebrow">GET STARTED</span><h2>Create account</h2><p>Join TeamFlow and get your team on track.</p></div><form class="form-grid" data-auth-form="register"><label class="field">Full name<input class="input" type="text" name="name" placeholder="Your name" required autocomplete="name" minlength="2"></label><label class="field">Email address<input class="input" type="email" name="email" placeholder="you@example.com" required autocomplete="email"></label><label class="field">Password<input class="input" type="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8"></label><label class="field">Confirm password<input class="input" type="password" name="confirmPassword" placeholder="Enter your password again" required autocomplete="new-password" minlength="8"></label><button class="button button-primary button-block" type="submit">Create account</button><p class="form-message" aria-live="polite"></p></form><div class="auth-separator"><span>or sign up with</span></div><div class="social-actions"><button class="button button-outline" type="button" data-demo-social="Google"><span class="social-google">G</span> Google</button><button class="button button-outline" type="button" data-demo-social="GitHub"><span class="social-github">GH</span> GitHub</button></div><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div></section></main><script src="../js/app.js" defer></script><script src="../js/auth.js" defer></script></body></html>
