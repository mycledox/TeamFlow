<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Team — TeamFlow</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/pages/team.css"></head>
<body><div class="app-layout"><team-sidebar></team-sidebar><div class="app-main"><team-navbar></team-navbar><main class="page-content"><header class="page-heading"><div><h1>Your team</h1><p>Meet the people moving your work forward.</p></div><button class="button button-primary" type="button" data-action="invite">Invite member <span class="button-plus" aria-hidden="true"></span></button></header><section class="team-summary"><article class="panel"><span class="team-summary-label">Team members</span><strong data-team-count>0</strong><span>People in this workspace</span></article><article class="panel"><span class="team-summary-label">Active projects</span><strong data-team-projects>0</strong><span>Projects your team is working on</span></article><article class="panel"><span class="team-summary-label">Open tasks</span><strong data-team-tasks>0</strong><span>Tasks still in progress</span></article></section><section class="panel team-list-panel" id="members"><div class="toolbar"><h2 class="panel-title">Members</h2><label class="field search-field"><span class="sr-only">Search members</span><input class="input" type="search" placeholder="Search members..." data-member-search></label></div><div class="member-grid" data-member-list></div></section></main></div></div><div id="modal-root"></div><script src="../js/app.js" defer></script><script src="../components/sidebar/sidebar.js" defer></script><script src="../components/navbar/navbar.js" defer></script><script src="../js/team.js" defer></script></body></html>
