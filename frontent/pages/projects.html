<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Projects — TeamFlow</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/pages/projects.css"></head>
<body><div class="app-layout"><team-sidebar></team-sidebar><div class="app-main"><team-navbar></team-navbar><main class="page-content"><header class="page-heading"><div><h1>Projects</h1><p>Organize your team's work from start to finish.</p></div><button class="button button-primary" type="button" data-action="create-project">New project <span class="button-plus" aria-hidden="true"></span></button></header><section class="panel"><div class="toolbar"><div class="segmented" role="group" aria-label="Filter projects"><button type="button" data-project-filter="all" aria-pressed="true">All</button><button type="button" data-project-filter="active" aria-pressed="false">Active</button><button type="button" data-project-filter="completed" aria-pressed="false">Completed</button></div><div class="toolbar-group"><label class="field search-field"><span class="sr-only">Search projects</span><input class="input" type="search" placeholder="Search projects..." data-project-search></label><select class="select project-sort" aria-label="Sort projects" data-project-sort><option value="updated">Recently updated</option><option value="name">Name</option><option value="due">Due date</option></select></div></div><div class="projects-grid" data-project-grid></div><div class="empty-state" data-project-empty hidden><div><span class="empty-symbol" aria-hidden="true"></span><h2>No projects found</h2><p>Create a project to give your team a clear place to plan, share updates and make progress.</p><button class="button button-primary empty-create" type="button" data-action="create-project">Create your first project</button></div></div></section></main></div></div><div id="modal-root"></div><script src="../js/app.js" defer></script><script src="../js/components/sidebar.js" defer></script><script src="../js/components/navbar.js" defer></script><script src="../js/project.js" defer></script></body></html>
