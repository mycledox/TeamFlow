<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications — TeamFlow</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/pages/notifications.css"></head>
<body><div class="app-layout"><team-sidebar></team-sidebar><div class="app-main"><team-navbar></team-navbar><main class="page-content"><header class="page-heading"><div><h1>Notifications</h1><p>Updates from your projects and team.</p></div><button class="button button-outline" type="button" data-mark-read>Mark all as read</button></header><section class="panel notification-panel"><div class="notification-filters"><button type="button" class="active" data-notification-filter="all" aria-pressed="true">All updates</button><button type="button" data-notification-filter="unread" aria-pressed="false">Unread <span data-unread-count>0</span></button></div><div class="notification-list" data-notification-list></div></section></main></div></div><script src="../js/app.js" defer></script><script src="../components/sidebar/sidebar.js" defer></script><script src="../components/navbar/navbar.js" defer></script><script src="../js/notification.js" defer></script></body></html>
