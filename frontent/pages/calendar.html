<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Calendar — TeamFlow</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/pages/calendar.css"></head>
<body><div class="app-layout"><team-sidebar></team-sidebar><div class="app-main"><team-navbar></team-navbar><main class="page-content"><header class="page-heading"><div><h1>Calendar</h1><p>See deadlines and keep your schedule in view.</p></div><button class="button button-primary" type="button" data-action="create-task">Add task <span class="button-plus" aria-hidden="true"></span></button></header><section class="calendar-layout"><article class="panel calendar-panel"><div class="calendar-toolbar"><button class="icon-button" type="button" data-calendar-prev data-symbol="‹" aria-label="Previous month"></button><h2 data-calendar-title></h2><button class="icon-button" type="button" data-calendar-next data-symbol="›" aria-label="Next month"></button><button class="button button-outline calendar-today" type="button" data-calendar-today>Today</button></div><div class="calendar-grid" data-calendar-grid></div></article><aside class="panel calendar-agenda"><div class="section-heading"><div><h2 class="panel-title">Upcoming tasks</h2><p>Tasks with a due date.</p></div></div><div class="agenda-list" data-calendar-agenda></div></aside></section></main></div></div><div id="modal-root"></div><script src="../js/app.js" defer></script><script src="../js/components/sidebar.js" defer></script><script src="../js/components/navbar.js" defer></script><script src="../js/calendar.js" defer></script></body></html>
